name: Test and publish container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: NODE_PATH=$(npm root) RUN_BROWSER_TESTS=1 BROWSER_ARTIFACT_DIR="$PWD/browser-artifacts" python -m unittest discover -s tests -p test_acceptance.py -k test_browser_controls_and_browser_closure -v
      - name: Browser review and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: browser-artifacts/
          if-no-files-found: ignore
      - name: HTTP, media, and recovery acceptance
        run: python -m unittest discover -s tests -v
      - run: docker build -t stream-recorder:test .
      - name: Focused media acceptance inside built image
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" stream-recorder:test python -m unittest discover -s /app/tests -p test_acceptance.py -k test_recording_produces_one_playable_download -v
      - name: Acceptance tests inside built image
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" stream-recorder:test python -m unittest discover -s /app/tests -v
      - name: Docker Compose smoke test
        env:
          RECORDER_IMAGE: stream-recorder:test
          RECORDER_PORT: '18080'
        run: |
          trap 'docker compose -p recorder-ci down' EXIT
          docker compose -p recorder-ci up -d --no-build
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18080/ | grep -q 'Stream Recorder'
      - name: Container and replacement smoke test
        run: |
          docker volume create recorder-smoke
          docker run -d --name recorder-smoke -p 127.0.0.1:8080:8080 -v recorder-smoke:/data stream-recorder:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break || sleep 1; done
          curl -fsS -X PUT -H 'Content-Type: application/json' -d '{"source_url":"https://example.org/live.m3u8","storage_cap_bytes":1073741824}' http://127.0.0.1:8080/api/settings
          curl -fsS -X PUT -H 'Content-Type: application/json' -d '{"player_url":"https://player.example/watch","allowed_origin":"https://player.example","public_tracking_url":"http://127.0.0.1:8080","timezone":"UTC","enabled":true}' http://127.0.0.1:8080/api/v1/viewers/config > viewer-config-before.json
          tracking_key=$(python -c 'import json; print(json.load(open("viewer-config-before.json"))["tracking_key"])')
          configuration_id=$(python -c 'import json; print(json.load(open("viewer-config-before.json"))["configuration_id"])')
          curl -fsS -X POST -H 'Origin: https://player.example' -H "X-Tracking-Key: $tracking_key" -H 'Content-Type: application/json' -d '{"browser_id":"container-browser-01","tab_id":"container-tab-00000001","playing":true}' http://127.0.0.1:8080/api/v1/viewers/report
          docker rm -f recorder-smoke
          docker run -d --name recorder-smoke -p 127.0.0.1:8080:8080 -v recorder-smoke:/data stream-recorder:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/settings | python -c 'import json,sys; s=json.load(sys.stdin); assert s["source_url"] == "https://example.org/live.m3u8"; assert s["storage_cap_bytes"] == 1073741824'
          curl -fsS http://127.0.0.1:8080/api/v1/viewers/config > viewer-config-after.json
          python -c 'import json; before=json.load(open("viewer-config-before.json")); after=json.load(open("viewer-config-after.json")); assert after["enabled"] is True; assert after["configuration_id"] == before["configuration_id"]; assert after["detail_retention_days"] == 90; assert after["history_retention_days"] == 730; assert "tracking_key" not in after'
          curl -fsS http://127.0.0.1:8080/api/v1/viewers/live | python -c 'import json,sys; s=json.load(sys.stdin); assert s["state"] == "available"; assert s["count"] == 1'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Stream Recorder'
          docker rm -f recorder-smoke
          docker volume rm recorder-smoke
  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/yaboisean319/stream-recorder
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
